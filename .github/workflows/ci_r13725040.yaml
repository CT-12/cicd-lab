name: CICD Homework

on:
  push:
    branches:
      - '**'

jobs:
  typecheck-and-testing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript-typecheck
        run: npm run typecheck

      - name: Prettier-check
        run: npm run format:check

      - name: Run tests
        run: |
          mkdir -p reports
          npm run test -- --reporter=default --reporter=github-actions --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: reports/
          if-no-files-found: error
